name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Permisos mínimos requeridos para desplegar en GitHub Pages mediante OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Evita colisiones entre ejecuciones simultáneas
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend directory
        run: |
          if [ ! -f "frontend/index.html" ]; then
            echo "::error::No se encontró frontend/index.html"
            exit 1
          fi
          echo "Frontend verificado con éxito."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
